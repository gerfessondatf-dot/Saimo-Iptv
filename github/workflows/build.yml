
name: Gerar APK Saimo IPTV

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "SaimoIPTV_Projeto_Android.zip"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair projeto
        run: |
          unzip SaimoIPTV_Projeto_Android.zip -d source

      - name: Compilar APK
        working-directory: source/SaimoIPTV_Android
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Saimo-IPTV-APK
          path: source/SaimoIPTV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
